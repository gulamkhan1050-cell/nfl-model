# Runs the trainer on GitHub's servers and publishes model.js.
# The phone app reads that file, so nothing needs installing or rebuilding.
# NFL data comes from nflverse, which is open - no token needed.
name: update model

on:
  schedule:
    - cron: "30 12 * * *"      # 18:00 India, before the US slate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests numpy pandas

      - uses: actions/cache@v4
        with:
          path: cache_nfl
          key: cache-nfl-${{ github.run_id }}
          restore-keys: cache-nfl-

      - name: Train
        run: python nfl_trainer.py

      - name: Build
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: python build.py

      - name: Publish model.js
        run: |
          git config user.name "model bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f model.js
          git diff --staged --quiet || git commit -m "model $(date -u +%Y-%m-%d)"
          git push

      - name: Purge the CDN
        run: curl -sS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/model.js" || true
